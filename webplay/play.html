<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<title>Gameworld im Browser</title>
<style>
  html, body { margin: 0; padding: 0; background: #101418; color: #f0f0f0; }
  body { font: 15px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; }
  #intro { padding: 1.5em; max-width: 40em; }
  #intro h1 { font-size: 1.4em; margin: 0 0 .5em; }
  #status { margin: 0 0 1em; }
  #diag {
    position: fixed; left: 0; bottom: 0; z-index: 2147483647;
    max-width: 100vw; max-height: 45vh; overflow: auto; margin: 0; padding: .5em .75em;
    background: rgba(0, 0, 0, .78); color: #d8f5d0; font: 11px/1.35 ui-monospace, Menlo, Consolas, monospace;
    white-space: pre-wrap; word-break: break-word; pointer-events: none;
  }
  #diag.error { color: #ffd0d0; }
</style>
</head>
<body>
<div id="intro">
  <h1>Gameworld im Browser</h1>
  <p id="status">Gameworld wird vorbereitet.</p>
</div>
<!-- launcher.js replaces the whole body at start with its canvas_container; play.js attaches #diag again afterwards. -->
<pre id="diag" aria-live="polite"></pre>
<script type="module" src="play.js"></script>
</body>
</html>

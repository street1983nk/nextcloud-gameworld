# Dev front of browser spike 04.2 (plan 08, RESEARCH "Folgerung", way 1).
#
# The AppAPI PHP proxy cannot do a WebSocket upgrade. Therefore this
# nginx provides a shared origin (http://localhost:8092):
#   /                    -> dev Nextcloud (host.docker.internal:8091)
#   /exapps/gameworld/   -> ExApp host process (host.docker.internal:10040), prefix removed,
#                           with WebSocket upgrade for /exapps/gameworld/play/ws
# Development only, port only on 127.0.0.1 (devfront.compose.yaml).
# Mounted as conf.d/default.conf, so it sits in the http context.

map $http_upgrade $gameworld_connection_upgrade {
    default upgrade;
    ''      close;
}

# Tailscale Serve (plan 10) sets X-Forwarded-Proto https; without a default the own scheme applies.
map $http_x_forwarded_proto $gameworld_forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

server {
    listen 80;
    server_name _;

    # No large uploads through the dev front; game data runs over GET and WebSocket.
    client_max_body_size 1m;

    location / {
        proxy_pass http://host.docker.internal:8091;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $gameworld_forwarded_proto;
    }

    location /exapps/gameworld/ {
        # Trailing slash: /exapps/gameworld/play/ws -> /play/ws
        proxy_pass http://host.docker.internal:10040/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $gameworld_connection_upgrade;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $gameworld_forwarded_proto;
        proxy_read_timeout 1800s;
        proxy_send_timeout 1800s;
        proxy_buffering off;
    }
}

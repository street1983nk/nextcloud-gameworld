# Dev-Front des Browser-Spikes 04.2 (Plan 08, RESEARCH "Folgerung", Weg 1).
#
# Der AppAPI-PHP-Proxy kann kein WebSocket-Upgrade. Darum liefert dieser
# nginx einen gemeinsamen Origin (http://localhost:8092):
#   /                    -> Dev-Nextcloud (host.docker.internal:8091)
#   /exapps/gameworld/   -> ExApp-Host-Prozess (host.docker.internal:10040), Präfix entfernt,
#                           mit WebSocket-Upgrade für /exapps/gameworld/play/ws
# Nur für die Entwicklung, Port nur auf 127.0.0.1 (devfront.compose.yaml).
# Wird als conf.d/default.conf eingebunden, steht also im http-Kontext.

map $http_upgrade $gameworld_connection_upgrade {
    default upgrade;
    ''      close;
}

# Tailscale Serve (Plan 10) setzt X-Forwarded-Proto https; ohne Vorgabe gilt das eigene Schema.
map $http_x_forwarded_proto $gameworld_forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

server {
    listen 80;
    server_name _;

    # Keine großen Uploads über die Dev-Front; Spieldaten laufen über GET und WebSocket.
    client_max_body_size 1m;

    location / {
        proxy_pass http://host.docker.internal:8091;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $gameworld_forwarded_proto;
    }

    location /exapps/gameworld/ {
        # Schrägstrich am Ende: /exapps/gameworld/play/ws -> /play/ws
        proxy_pass http://host.docker.internal:10040/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $gameworld_connection_upgrade;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $gameworld_forwarded_proto;
        proxy_read_timeout 1800s;
        proxy_send_timeout 1800s;
        proxy_buffering off;
    }
}

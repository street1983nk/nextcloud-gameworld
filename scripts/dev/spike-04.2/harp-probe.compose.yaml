# HaRP probe for browser spike 04.2 (plan 03, task 2), dev stack only and only
# for the duration of the probe. Checks whether HaRP passes the response headers of an ExApp
# through unchanged and permits a WebSocket upgrade with identity
# (live with nextcloud/app-skeleton-python).
#
# Without Docker socket: HaRP gets no access to the Docker engine. The
# daemon is registered as "manual-install" with --harp (template "Harp Manual
# Install" from occ app_api:daemon:register --help), the skeleton starts here as a
# second service and logs in via frpc at the FRP server of HaRP. HaRP
# then forwards to 127.0.0.1:<APP_PORT> in its own container
# (AppAPI HarpService::getExAppHost).
#
# Start (values only in .dev/, never in the repository):
#   HARP_PROBE_KEY=$(cat .dev/harp-probe.key) \
#   HARP_PROBE_APP_SECRET=$(cat .dev/harp-probe-app.secret) \
#     docker compose -f scripts/dev/spike-04.2/harp-probe.compose.yaml up -d
# Teardown:
#   docker compose -f scripts/dev/spike-04.2/harp-probe.compose.yaml down -v
name: gameworld-harp-probe

services:
  harp:
    image: ghcr.io/nextcloud/nextcloud-appapi-harp:release
    container_name: appapi-harp-probe
    hostname: appapi-harp-probe
    environment:
      HP_SHARED_KEY: ${HARP_PROBE_KEY:?HARP_PROBE_KEY fehlt}
      # The dev Nextcloud trusts only localhost and host.docker.internal.
      NC_INSTANCE_URL: http://host.docker.internal:8091
      # Negative controls produce 401; without a higher threshold HaRP blocks, after
      # 10 failed attempts in 5 minutes, the address of the checker.
      HP_BLACKLIST_COUNT: "1000"
      # The skeleton gets no FRP certificates here (HaRP otherwise copies them in
      # on deploy through the Docker engine); only in the probe network without TLS.
      HP_FRP_DISABLE_TLS: "true"
      HP_LOG_LEVEL: info
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:8780:8780"
      - "127.0.0.1:8782:8782"
    networks:
      - devstack

  skeleton:
    image: ghcr.io/nextcloud/app-skeleton-python:latest
    container_name: app-skeleton-python-probe
    depends_on:
      - harp
    environment:
      APP_ID: app-skeleton-python
      APP_DISPLAY_NAME: App Skeleton
      APP_VERSION: "3.0.3"
      APP_SECRET: ${HARP_PROBE_APP_SECRET:?HARP_PROBE_APP_SECRET fehlt}
      APP_PORT: "23000"
      APP_HOST: 127.0.0.1
      APP_PERSISTENT_STORAGE: /tmp/storage
      NEXTCLOUD_URL: http://host.docker.internal:8091
      # frpc in the skeleton logs in with this value (start.sh of the skeleton).
      HP_SHARED_KEY: ${HARP_PROBE_KEY:?HARP_PROBE_KEY fehlt}
      HP_FRP_ADDRESS: appapi-harp-probe
      HP_FRP_PORT: "8782"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - devstack

  # Only with --profile gameworld: tunnel from the FRP server in HaRP to the Gameworld
  # host process on port 10040, so that the real play page /play/ behind HaRP
  # can be measured (the skeleton itself sends no COOP/COEP). Gameworld
  # is temporarily registered for this on the daemon harp_probe with port 23001.
  gameworld-tunnel:
    image: ghcr.io/nextcloud/app-skeleton-python:latest
    container_name: gameworld-harp-tunnel-probe
    profiles: ["gameworld"]
    depends_on:
      - harp
    environment:
      HP_SHARED_KEY: ${HARP_PROBE_KEY:?HARP_PROBE_KEY fehlt}
    entrypoint: ["sh", "-c"]
    command:
      - |
        umask 077
        cat > /tmp/frpc.toml <<EOF
        serverAddr = "appapi-harp-probe"
        serverPort = 8782
        loginFailExit = false
        transport.tls.enable = false
        metadatas.token = "$${HP_SHARED_KEY}"
        [[proxies]]
        name = "gameworld"
        type = "tcp"
        localIP = "host.docker.internal"
        localPort = 10040
        remotePort = 23001
        EOF
        exec frpc -c /tmp/frpc.toml
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - devstack

networks:
  devstack:
    name: gameworld-dev_default
    external: true

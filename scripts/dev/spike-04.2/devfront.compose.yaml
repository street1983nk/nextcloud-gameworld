# Dev front of browser spike 04.2 (plan 08): shared origin for Nextcloud and
# play page with WebSocket. Start:
#   docker compose -f scripts/dev/spike-04.2/devfront.compose.yaml up -d
# Prerequisite: dev Nextcloud on 127.0.0.1:8091 (scripts/dev/compose.yaml) and the
# ExApp as a host process on 10040 (GAMEWORLD_BROWSER_SPIKE=dev,
# GAMEWORLD_PLAY_ORIGINS=http://localhost:8092, GAMEWORLD_PLAY_BASE=/exapps/gameworld).
# Nextcloud needs localhost:8092 in trusted_domains (occ config:system:set).
name: gameworld-devfront

services:
  devfront:
    image: nginx:1.29-alpine
    ports:
      # Loopback only (T-04.2-42); devices reach the dev front only in plan 10 via Tailscale Serve.
      - "127.0.0.1:8092:80"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./devfront.nginx.conf:/etc/nginx/conf.d/default.conf:ro

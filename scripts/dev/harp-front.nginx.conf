# Front of the dev HaRP (plan 06-12, pattern spike-04.2/devfront.nginx.conf).
#
# AppAPI uses nextcloud_url of the daemon twice: as the address of the ExApp
# ({nextcloud_url}/exapps/gameworld, must reach HaRP) and as NEXTCLOUD_URL
# in the ExApp container (must reach the instance). Only one address IN FRONT of
# both halves achieves that, just like the web server in front of a real Nextcloud:
#   /exapps/  -> HaRP (appapi-harp:8780), with WebSocket upgrade for the play page
#   /         -> test Nextcloud (harp-nc:80)
# Development only, port only on 127.0.0.1 (harp.compose.yaml).
# Mounted as conf.d/default.conf, so it sits in the http context.

map $http_upgrade $gameworld_connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 512m;

    location /exapps/ {
        proxy_pass http://appapi-harp:8780;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $gameworld_connection_upgrade;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 1800s;
        proxy_send_timeout 1800s;
        proxy_buffering off;
    }

    location / {
        proxy_pass http://harp-nc:80;
        proxy_http_version 1.1;
        # Host header unchanged: localhost[:8093] from outside, harp-front from HaRP and
        # the ExApp; both are in NEXTCLOUD_TRUSTED_DOMAINS.
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 300s;
    }
}

# Front des Dev-HaRP (Plan 06-12, Muster spike-04.2/devfront.nginx.conf).
#
# AppAPI nutzt nextcloud_url des Daemons zweimal: als Adresse der ExApp
# ({nextcloud_url}/exapps/gameworld, muss HaRP erreichen) und als NEXTCLOUD_URL
# im ExApp-Container (muss die Instanz erreichen). Das leistet nur eine Adresse
# VOR beiden Hälften, genau wie der Webserver vor einer echten Nextcloud:
#   /exapps/  -> HaRP (appapi-harp:8780), mit WebSocket-Upgrade für die Spielseite
#   /         -> Test-Nextcloud (harp-nc:80)
# Nur für die Entwicklung, Port nur auf 127.0.0.1 (harp.compose.yaml).
# Wird als conf.d/default.conf eingebunden, steht also im http-Kontext.

map $http_upgrade $gameworld_connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 512m;

    location /exapps/ {
        proxy_pass http://appapi-harp:8780;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $gameworld_connection_upgrade;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 1800s;
        proxy_send_timeout 1800s;
        proxy_buffering off;
    }

    location / {
        proxy_pass http://harp-nc:80;
        proxy_http_version 1.1;
        # Host-Kopf unverändert: localhost[:8093] von außen, harp-front von HaRP und
        # der ExApp; beide stehen in NEXTCLOUD_TRUSTED_DOMAINS.
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 300s;
    }
}

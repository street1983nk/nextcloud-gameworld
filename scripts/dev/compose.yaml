# Dev-Stack für Gameworld: eigene Nextcloud 34.0.3 plus gescopter Docker-Proxy.
# Projektname gameworld-dev, damit nichts mit den Findling-Stacks auf derselben
# Maschine kollidiert. Start: docker compose -f scripts/dev/compose.yaml up -d
name: gameworld-dev

services:
  app:
    image: nextcloud:34.0.3-apache
    ports:
      # Loopback-Bindung auch hier: Die Dev-Nextcloud hat ein festes
      # Admin-Passwort aus dem Repository; im LAN erreichbar wäre sie ein
      # signierender Zugang zur ExApp und damit zur Container-Provisionierung.
      - "127.0.0.1:${GAMEWORLD_NC_PORT:-8091}:80"
    environment:
      SQLITE_DATABASE: nextcloud
      NEXTCLOUD_ADMIN_USER: admin
      NEXTCLOUD_ADMIN_PASSWORD: gameworld-dev-admin
      NEXTCLOUD_TRUSTED_DOMAINS: "localhost host.docker.internal"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - nextcloud:/var/www/html

  gameworld-docker-proxy:
    image: tecnativa/docker-socket-proxy:v0.5.0@sha256:1f5038b54f06c3e18422902cf00ba21803d1c97805aae032e5e6673d532d3459
    # Wie in docs/install.md: Nach einem Docker-Neustart ist der Proxy wieder
    # da, egal ob vor oder nach der ExApp; der Reconciler wartet ohnehin.
    restart: unless-stopped
    environment:
      # Nur was der Provisioner braucht. Alle übrigen Bereiche stehen explizit
      # auf 0, damit ein geänderter Image-Default nichts unbemerkt öffnet.
      CONTAINERS: 1
      IMAGES: 1
      POST: 1
      VOLUMES: 1
      EXEC: 0
      INFO: 0
      NETWORKS: 0
      BUILD: 0
      SYSTEM: 0
      SECRETS: 0
      SWARM: 0
      NODES: 0
      SERVICES: 0
      TASKS: 0
      PLUGINS: 0
      CONFIGS: 0
      DISTRIBUTION: 0
      AUTH: 0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    ports:
      # Loopback-Bindung ist Pflicht: Jeder mit Zugriff auf diesen Port kann
      # privilegierte Container erzeugen und ist damit root-äquivalent auf dem
      # Host. Nur für die Entwicklung, weil die ExApp hier als Host-Prozess läuft.
      - "127.0.0.1:23750:2375"

volumes:
  nextcloud: {}

# Dev stack for Gameworld: own Nextcloud 34.0.3 plus scoped Docker proxy.
# Project name gameworld-dev, so that nothing collides with the Findling stacks on the same
# machine. Start: docker compose -f scripts/dev/compose.yaml up -d
name: gameworld-dev

services:
  app:
    image: nextcloud:34.0.3-apache
    ports:
      # Loopback binding here as well: the dev Nextcloud has a fixed
      # admin password from the repository; reachable in the LAN it would be a
      # signing access to the ExApp and thus to the container provisioning.
      - "127.0.0.1:${GAMEWORLD_NC_PORT:-8091}:80"
    environment:
      SQLITE_DATABASE: nextcloud
      NEXTCLOUD_ADMIN_USER: admin
      NEXTCLOUD_ADMIN_PASSWORD: gameworld-dev-admin
      NEXTCLOUD_TRUSTED_DOMAINS: "localhost host.docker.internal"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - nextcloud:/var/www/html

  gameworld-docker-proxy:
    image: tecnativa/docker-socket-proxy:v0.5.0@sha256:1f5038b54f06c3e18422902cf00ba21803d1c97805aae032e5e6673d532d3459
    # As in docs/install.md: after a Docker restart the proxy is back
    # again, no matter whether before or after the ExApp; the reconciler waits anyway.
    restart: unless-stopped
    environment:
      # Only what the provisioner needs. All other areas are explicitly set
      # to 0, so that a changed image default does not open anything unnoticed.
      CONTAINERS: 1
      IMAGES: 1
      POST: 1
      VOLUMES: 1
      EXEC: 0
      INFO: 0
      NETWORKS: 0
      BUILD: 0
      SYSTEM: 0
      SECRETS: 0
      SWARM: 0
      NODES: 0
      SERVICES: 0
      TASKS: 0
      PLUGINS: 0
      CONFIGS: 0
      DISTRIBUTION: 0
      AUTH: 0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    ports:
      # Loopback binding is mandatory: anyone with access to this port can create
      # privileged containers and is thereby root-equivalent on the
      # host. Development only, because the ExApp runs here as a host process.
      - "127.0.0.1:23750:2375"

volumes:
  nextcloud: {}

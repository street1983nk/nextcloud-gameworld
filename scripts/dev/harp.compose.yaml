# Dev HaRP for Gameworld (plan 06-12): checks the installation path of the app store
# before the first push and before the certificate. A real HaRP daemon pulls the
# Gameworld image from a local registry and creates the ExApp container itself,
# exactly like a store installation; only archive download and
# signature check are missing (06-RESEARCH section 5.2 and 9).
#
# Own test instance, separate from the dev stack (scripts/dev/compose.yaml): own
# Nextcloud 34.0.3 (service harp-nc), own scoped Docker proxy, own network
# gameworld-dev-harp_default. The running dev Nextcloud, its ExApp registration
# and its worlds therefore stay untouched; deactivation (D-17) or a
# stopped proxy during acceptance affect only this test instance.
#
# Do not start directly, but via scripts/dev/harp-install.sh: the script
# creates the shared key in .dev/harp.key (gitignored) and passes it in
# as GAMEWORLD_HARP_KEY. By hand only with the variable set:
#   GAMEWORLD_HARP_KEY=$(cat .dev/harp.key) docker compose -f scripts/dev/harp.compose.yaml up -d
# Teardown: sh scripts/dev/harp-install.sh --uninstall
#
# Images by index digest (docker buildx imagetools inspect, retrieved on
# 24.10.2026), so that a moved tag does not silently change what the run proves.
# Exception harp-nc: same line as compose.yaml (nextcloud:34.0.3-apache).
name: gameworld-dev-harp

services:
  harp-nc:
    image: nextcloud:34.0.3-apache
    container_name: gameworld-dev-harp-nc
    restart: unless-stopped
    environment:
      SQLITE_DATABASE: nextcloud
      NEXTCLOUD_ADMIN_USER: admin
      # Pure dev account of a test instance without host port; reachable only through
      # the front on 127.0.0.1:8093.
      NEXTCLOUD_ADMIN_PASSWORD: gameworld-harp-admin
      # localhost: acceptance and browser through the front; harp-front: HaRP and the
      # ExApp container (nextcloud_url of the daemon). The port is ignored in the comparison.
      NEXTCLOUD_TRUSTED_DOMAINS: "localhost harp-front"
    volumes:
      - harp-nextcloud:/var/www/html

  gameworld-docker-proxy:
    # Same image and same flags as in compose.yaml (docs/install.md).
    image: tecnativa/docker-socket-proxy:v0.5.0@sha256:1f5038b54f06c3e18422902cf00ba21803d1c97805aae032e5e6673d532d3459
    container_name: gameworld-dev-harp-docker-proxy
    restart: unless-stopped
    environment:
      CONTAINERS: 1
      IMAGES: 1
      POST: 1
      VOLUMES: 1
      EXEC: 0
      INFO: 0
      NETWORKS: 0
      BUILD: 0
      SYSTEM: 0
      SECRETS: 0
      SWARM: 0
      NODES: 0
      SERVICES: 0
      TASKS: 0
      PLUGINS: 0
      CONFIGS: 0
      DISTRIBUTION: 0
      AUTH: 0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    # No host port: only the ExApp container in the same network talks to the proxy.

  appapi-harp:
    # Tag release, index digest of 24.10.2026.
    image: ghcr.io/nextcloud/nextcloud-appapi-harp:release@sha256:2c994c9b3d59fb04d09da236d9caccaadf8db22b848c7f48980fbb813d1de7d6
    container_name: gameworld-dev-appapi-harp
    hostname: appapi-harp
    restart: unless-stopped
    environment:
      # No default value: without a key compose aborts instead of starting a proxy with
      # an empty secret (T-06-52). Value only in .dev/harp.key.
      HP_SHARED_KEY: ${GAMEWORLD_HARP_KEY:?GAMEWORLD_HARP_KEY fehlt, zuerst sh scripts/dev/harp-install.sh}
      # Where HaRP reaches the instance: through the front (trusted host header).
      NC_INSTANCE_URL: http://harp-front
      # Negative controls of the acceptance produce 401; the default would otherwise block the
      # address of the front after 10 failed attempts in 5 minutes (pattern harp-probe).
      HP_BLACKLIST_COUNT: "1000"
      HP_LOG_LEVEL: info
      # FRP TLS stays on (HaRP default): HaRP generates the certificates in
      # /certs and copies them into the ExApp container on deploy (start.sh).
    volumes:
      # The Docker socket only here: HaRP is the deploy daemon and creates the
      # ExApp container. Access to the socket is root-equivalent on the
      # host; HaRP exists precisely so that only ONE component holds it. The
      # ExApp itself never gets it, it only talks to the scoped proxy above.
      - /var/run/docker.sock:/var/run/docker.sock
      - harp-certs:/certs
    # No host ports: Nextcloud, front and ExApp reach HaRP in the Compose network.

  gameworld-registry:
    # registry:2, index digest of 24.10.2026. Only for the locally built image,
    # no push to ghcr.io.
    image: registry:2@sha256:a3d8aaa63ed8681a604f1dea0aa03f100d5895b6a58ace528858a7b332415373
    container_name: gameworld-dev-registry
    restart: unless-stopped
    ports:
      # Loopback only (T-06-53): the Docker daemon pulls from localhost:5000.
      - "127.0.0.1:5000:5000"
    volumes:
      - registry-data:/var/lib/registry

  harp-front:
    # nginx:1.29-alpine, index digest of 24.10.2026.
    image: nginx:1.29-alpine@sha256:5616878291a2eed594aee8db4dade5878cf7edcb475e59193904b198d9b830de
    container_name: gameworld-dev-harp-front
    restart: unless-stopped
    depends_on:
      - appapi-harp
      - harp-nc
    ports:
      # Loopback only (T-06-53): one address in front of both halves, like the web server
      # in front of a real Nextcloud.
      - "127.0.0.1:8093:80"
    volumes:
      - ./harp-front.nginx.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  harp-nextcloud: {}
  harp-certs: {}
  registry-data: {}
